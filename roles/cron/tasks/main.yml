- name: Run Send Logs Job
  cron:
    name: "ios_api:send-logs:every_midnight"
    minute: "0"
    hour: "0"
    job: "/bin/bash /opt/scripts/send-logs.sh >> /var/log/cron-send-logs.log 2>&1"
    user: "root"

- name: Run remove subscriptions Job
  cron:
    name: "ios_api:remove-subscriptions:sunday_midnight"
    minute: "0"
    hour: "0"
    weekday: "0"
    job: "/bin/bash /opt/scripts/remove-subscriptions.sh >> /var/log/cron-remove-subscriptions.log 2>&1"
    user: "root"

- name: Run seed-subscriptions Job
  cron:
    name: "ios_api:seed-subscriptions:sunday_midnight"
    minute: "5"
    hour: "0"
    weekday: "0"
    job: "/bin/bash /opt/scripts/seed-subscriptions.sh >> /var/log/cron-seed-subscriptions.log 2>&1"
    user: "root"

- name: Run seed-products Job
